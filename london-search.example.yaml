name: London Flat Search
description: 2-bed (or large 1-bed) in East/North London, £2,800 max
version: '2.0'

# Schema v2.0. Each location carries its Rightmove region_id.
# Region IDs are discovered and verified via scripts/discover_borough_regions.py
# and then written here. All IDs were live-verified on 2026-05-02.
#
# Typeahead endpoint: https://los.rightmove.co.uk/typeahead?query=<term>&limit=10
# Each match returns { "id": "NNNNN", "type": "REGION", "displayName": "..." }
# The locationIdentifier is constructed as REGION^NNNNN.
#
# Bug note: REGION^85279 (old Islington ID) and REGION^87487 (Farringdon) both
# redirect to page-not-found or return zero results. They are removed.
# The old _KNOWN_IDS entry REGION^87490 is Greater London (13,000+ results),
# not Shoreditch/Hackney -- using it floods the pipeline. Correct IDs are below.

# Wave 2 Agent F (2026-05-04): min_price, max_price, min_bedrooms and
# max_bedrooms moved to filter-scoring-config.yaml under hard_filters.
# homehunt/config_loader.py reads them from the unified config when they
# are absent here, so the Rightmove query stays aligned with the local
# hard filter without a second source of truth.
# Only scrape-stage parameters (radius, max_results, delays) remain here.
defaults:
  radius: 0.5
  max_results: 40
  page_delay: 2.0
  scrape_delay: 1.0

profiles:

- name: islington_borough
  description: All Islington neighbourhoods (Angel, Barnsbury, Highbury, Holloway, Tufnell Park, Archway, Finsbury Park)
  locations:
